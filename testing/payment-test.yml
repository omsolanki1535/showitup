# Artillery load test for checkout in demo payment mode (no Razorpay keys).
# Each virtual user creates a server-priced order and verifies it. It does not
# book seats, so the seat map is left untouched.
#   npx artillery run testing/payment-test.yml
config:
  target: "http://localhost:8000"
  phases:
    - duration: 60
      arrivalRate: 10
  variables:
    email: "attendee@showitup.demo"
    password: "Demo@1234"

scenarios:
  - name: "Login + create order + verify demo payment"
    flow:
      - post:
          url: "/api/user/login"
          json:
            email: "{{ email }}"
            password: "{{ password }}"
      - get:
          url: "/api/events/get-events"
          capture:
            - json: "$.events[0]._id"
              as: "eventId"
      - post:
          url: "/api/payment/order"
          json:
            event_id: "{{ eventId }}"
            seats: ["A1"]
          capture:
            - json: "$.data.id"
              as: "orderId"
      - post:
          url: "/api/payment/verify"
          json:
            razorpay_order_id: "{{ orderId }}"
