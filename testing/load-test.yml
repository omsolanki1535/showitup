# Artillery load test for the public events listing.
#   npx artillery run testing/load-test.yml
config:
  target: "http://localhost:8000"
  phases:
    - duration: 60
      arrivalRate: 200
scenarios:
  - flow:
      - get:
          url: "/api/events/get-events"
      - get:
          url: "/api/health"
