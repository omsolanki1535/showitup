# Artillery load test: log in with the seeded demo attendee, then browse.
# Run against a local server started with NODE_ENV=test (rate limiting off),
# or expect 429 responses once the login rate limit is reached.
#   cd backend && npm run seed
#   npx artillery run testing/auth-test.yml
config:
  target: "http://localhost:8000"
  phases:
    - duration: 60
      arrivalRate: 20
  variables:
    email: "attendee@showitup.demo"
    password: "Demo@1234"

scenarios:
  - name: "Login + browse events + profile"
    flow:
      # The session cookie is stored per virtual user automatically.
      - post:
          url: "/api/user/login"
          json:
            email: "{{ email }}"
            password: "{{ password }}"
      - get:
          url: "/api/events/get-events"
          capture:
            - json: "$.events[0]._id"
              as: "eventId"
      - get:
          url: "/api/events/get-events/{{ eventId }}"
      - get:
          url: "/api/user/getUserProfile"
