# Render Blueprint: deploys the API and the static frontend together.
# In Render: New > Blueprint > pick this repo. You will be asked for the
# values marked `sync: false`. See DEPLOYMENT.md.
services:
  - type: web
    name: showitup-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false            # e.g. https://showitup-web.onrender.com
      - key: SERVER_URL
        sync: false            # e.g. https://showitup-api.onrender.com
      - key: KEEP_ALIVE
        value: "true"
      - key: EMAIL
        sync: false            # optional: Gmail address for OTP emails
      - key: PASSWORD
        sync: false            # optional: Gmail app password
      - key: RAZORPAY_KEY
        sync: false            # optional: leave empty for demo payments
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false            # optional: enables the chatbot

  - type: web
    name: showitup-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API
        sync: false            # e.g. https://showitup-api.onrender.com/api
      - key: VITE_RAZORPAY_KEY
        sync: false            # optional: Razorpay key id (public)
